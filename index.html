<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<script>try{var p=JSON.parse(localStorage.getItem("hl_theme"));document.documentElement.dataset.theme=(p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches))?"dark":"light"}catch(e){}</script>
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HostelLink">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HostelLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <nav id="nav" class="nav" aria-label="Main navigation" hidden></nav>
  <main id="app"></main>
</div>
<button class="tfloat" id="tf" data-theme-toggle aria-label="Switch between light and dark mode" hidden></button>
<script src="app.js"></script>
</body>
</html>
